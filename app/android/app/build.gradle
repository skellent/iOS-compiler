apply plugin: 'com.android.application'

def signingProperties = new Properties()
def signingPropertiesFile = project.file('local.properties')
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

def releaseStorePassword = System.getenv('PANICBUTTON_RELEASE_STORE_PASSWORD') ?: signingProperties['RELEASE_STORE_PASSWORD']
def releaseKeyPassword = System.getenv('PANICBUTTON_RELEASE_KEY_PASSWORD') ?: signingProperties['RELEASE_KEY_PASSWORD']
def releaseKeyAlias = signingProperties['RELEASE_KEY_ALIAS'] ?: 'panicbutton'
def releaseStoreFile = signingProperties['RELEASE_STORE_FILE'] ?: 'release-play.keystore'
def releaseSigningConfigured = file(releaseStoreFile).exists() && releaseStorePassword && releaseKeyPassword
def releaseBuildRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

if (releaseBuildRequested && !releaseSigningConfigured) {
    throw new GradleException(
        'Release signing is incomplete. Set PANICBUTTON_RELEASE_STORE_PASSWORD and ' +
        'PANICBUTTON_RELEASE_KEY_PASSWORD, or add the corresponding values to ' +
        'android/app/local.properties.'
    )
}

android {
    namespace = "com.keycodelogics.panicbutton"
    compileSdk {
        version = release(rootProject.ext.compileSdkVersion) {
            it.minorApiLevel = rootProject.ext.compileSdkMinorVersion
        }
    }
    defaultConfig {
        applicationId "com.keycodelogics.panicbutton"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "3.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) { signingConfig signingConfigs.release }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
