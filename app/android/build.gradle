// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor plugin projects consume the integer compileSdkVersion above while
// configuring themselves. Override their final Android library SDK selection
// with the installed Android 16 QPR2 (API 36.1) platform.
subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        subproject.android {
            compileSdk {
                version = release(rootProject.ext.compileSdkVersion) {
                    it.minorApiLevel = rootProject.ext.compileSdkMinorVersion
                }
            }
        }

    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
