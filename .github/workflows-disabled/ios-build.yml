# Disabled while this branch is stored in the private repository.
# Move this file back to .github/workflows in the public build repository.
name: iOS compile check

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ios-*.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ios-*.yml"

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile for iPhone Simulator
    runs-on: macos-26
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ vars.IOS_API_BASE_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Validate configuration
        run: |
          if [[ -z "$API_BASE_URL" ]]; then
            echo "Repository variable IOS_API_BASE_URL is required."
            exit 1
          fi

      - name: Install JavaScript dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Generate and synchronize the iOS project
        working-directory: app
        run: bun run sync:ios

      - name: Compile without code signing
        working-directory: app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator application
        uses: actions/upload-artifact@v5
        with:
          name: panic-button-ios-simulator
          path: app/build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
